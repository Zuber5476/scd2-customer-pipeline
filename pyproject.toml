[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scd2-customer-pipeline"
version = "1.0.0"
description = "A reproducible, idempotent SCD Type 2 data engineering pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[project.scripts]
scd2 = "scd2_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
